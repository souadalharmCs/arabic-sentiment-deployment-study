name: mono3x

# Monolithic scaled up: one FastAPI + MARBERT container with the same total CPUs/RAM as micro3 (3 x 2 CPUs)
services:
  api:
    image: sentiment-system2-api1:latest
    container_name: mono3x-api
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"          # per-request threads kept equal to micro3
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    cpus: 6
    mem_limit: 6g
    ports:
      - "8080:8000"
    restart: "no"

volumes:
  hf_cache:
    external: true
