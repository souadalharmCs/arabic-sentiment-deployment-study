name: mono3w2t

# Tuned single-container baseline: same budget (6 CPUs, 6 GB), THREE uvicorn workers with TWO threads each
# (3 copies of the model; 3 x 2 = 6 threads).
services:
  api:
    image: sentiment-system2-api1:latest
    container_name: mono3w2t-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3"]
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    cpus: 6
    mem_limit: 6g
    ports:
      - "8080:8000"
    restart: "no"

volumes:
  hf_cache:
    external: true
