worker_processes 1;

events {
    worker_connections 4096;
}

http {
    # time, status, total request time, upstream time, which replica served it
    log_format lb '$time_iso8601 "$request" $status '
                  'rt=$request_time urt=$upstream_response_time up=$upstream_addr';
    access_log /var/log/nginx/access.log lb;

    upstream sentiment {
        # round-robin (default) - keep the same policy in all experiments
        server api1:8000;
        server api2:8000;
        server api3:8000;
        keepalive 64;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        location / {
            proxy_pass http://sentiment;
        }
    }
}
