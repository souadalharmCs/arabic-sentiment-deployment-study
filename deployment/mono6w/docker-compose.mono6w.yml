name: mono6w

# Tuned single-container baseline: one container with the same budget as mono3x / micro3 services (6 CPUs, 6 GB),
# but with SIX uvicorn worker processes (one per CPU), each single-threaded (6 copies of the model).
services:
  api:
    image: sentiment-system2-api1:latest
    container_name: mono6w-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "6"]
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    cpus: 6
    mem_limit: 6g
    ports:
      - "8080:8000"
    restart: "no"

volumes:
  hf_cache:
    external: true
