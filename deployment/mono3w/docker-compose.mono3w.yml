name: mono3w

# One container, same total resources as micro3 / mono3x (6 CPUs, 6 GB),
# but with 3 uvicorn worker processes (3 copies of the model) instead of 1 process.
services:
  api:
    image: sentiment-system2-api1:latest
    container_name: mono3w-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3"]
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    cpus: 6
    mem_limit: 6g
    ports:
      - "8080:8000"
    restart: "no"

volumes:
  hf_cache:
    external: true
